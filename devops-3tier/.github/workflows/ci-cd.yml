name: 3-Tier DevOps CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com

jobs:
  # ─── Job 1: Test ────────────────────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: appuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Run backend tests
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_USER: appuser
          DB_PASSWORD: testpassword
          DB_NAME: testdb
        run: npm test

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  # ─── Job 2: Security Scan ───────────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scan (backend)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: ./backend
          severity: CRITICAL,HIGH
          exit-code: 1

      - name: Run Trivy vulnerability scan (frontend)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: ./frontend
          severity: CRITICAL,HIGH
          exit-code: 1

  # ─── Job 3: Build & Push Images ─────────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.ref == 'refs/heads/main'
    outputs:
      image-tag: ${{ steps.vars.outputs.short_sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: vars
        run: echo "short_sha=$(echo ${{ github.sha }} | cut -c1-8)" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/devops-3tier/frontend:${{ steps.vars.outputs.short_sha }}
            ${{ env.ECR_REGISTRY }}/devops-3tier/frontend:latest
          cache-from: type=registry,ref=${{ env.ECR_REGISTRY }}/devops-3tier/frontend:cache
          cache-to: type=registry,ref=${{ env.ECR_REGISTRY }}/devops-3tier/frontend:cache,mode=max

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/devops-3tier/backend:${{ steps.vars.outputs.short_sha }}
            ${{ env.ECR_REGISTRY }}/devops-3tier/backend:latest
          cache-from: type=registry,ref=${{ env.ECR_REGISTRY }}/devops-3tier/backend:cache
          cache-to: type=registry,ref=${{ env.ECR_REGISTRY }}/devops-3tier/backend:cache,mode=max

  # ─── Job 4: Deploy to Kubernetes ────────────────────────────────────────────
  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name devops-3tier-cluster --region ${{ env.AWS_REGION }}

      - name: Deploy to Kubernetes
        run: |
          IMAGE_TAG=${{ needs.build-and-push.outputs.image-tag }}

          # Update image tags
          kubectl set image deployment/frontend \
            frontend=${{ env.ECR_REGISTRY }}/devops-3tier/frontend:${IMAGE_TAG} \
            -n app

          kubectl set image deployment/backend \
            backend=${{ env.ECR_REGISTRY }}/devops-3tier/backend:${IMAGE_TAG} \
            -n app

          # Wait for rollout
          kubectl rollout status deployment/frontend -n app --timeout=5m
          kubectl rollout status deployment/backend  -n app --timeout=5m

      - name: Verify deployment
        run: |
          kubectl get pods -n app
          kubectl get svc  -n app

      - name: Notify on failure
        if: failure()
        run: |
          echo "Deployment failed! Rolling back..."
          kubectl rollout undo deployment/frontend -n app
          kubectl rollout undo deployment/backend  -n app
